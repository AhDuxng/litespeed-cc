# Server configuration for the Starlink congestion-control experiment.
#
# Experimental factor: the congestion controller of the sender. In a download the
# server emits the data and the client only acknowledges, so the controller under
# test is selected on the server. One picoquic process per controller listens on
# its own UDP port; the client selects a controller by selecting a port.
#
# INSTANCES            label:picoquic_algorithm:udp_port
#                        cubic   picoquic/cubic.c   CUBIC, C = 0.4, beta = 3/4, HyStart
#                        bbr     picoquic/bbr.c     BBRv3 (draft-cardwell-iccrg-bbr-congestion-control-02)
#                        newreno picoquic/newreno.c NewReno AIMD (picoquic also accepts "reno")
# PAYLOADS             file:size, size in GNU head(1) units (M = 2^20 bytes). Content is
#                      drawn from /dev/urandom so that no layer can compress it.
# PICOQUIC_COMMIT      pins the QUIC implementation, and transitively picotls, so that
#                      every controller is measured on identical transport code.
# TLS_NAME, PUBLIC_IP  subject names of the self-signed certificate.
# SOCKET_BUFFER_BYTES  SO_SNDBUF/SO_RCVBUF requested by picoquic (-B); identical for all
#                      controllers and larger than the path BDP, so the socket never caps cwnd.
# QLOG                 1 writes one qlog per connection (sender cwnd/RTT/loss traces).
#                      About 1 KB per packet: tens of MB per 50 MB transfer.
# SERVICE_USER         account that runs the systemd units.

PICOQUIC_REPO="https://github.com/private-octopus/picoquic.git"
PICOQUIC_COMMIT="36f49b73d532369882d97474ac018655b6739a58"

INSTANCES=(
    "cubic:cubic:4451"
    "bbrv3:bbr:4452"
    "reno:newreno:4453"
)

PAYLOADS=(
    "2MB.bin:2M"
    "50MB.bin:50M"
)

TLS_NAME="starlink-cc.test"
PUBLIC_IP="47.129.174.173"
SOCKET_BUFFER_BYTES=4194304
QLOG=0
SERVICE_USER="ubuntu"
