# Server configuration of the Starlink end-to-end download experiment.
#
# Factors: protocol stack (HTTP/2 over TCP+TLS 1.2, HTTP/2 over TCP+TLS 1.3,
# HTTP/3 over QUIC) x server congestion control algorithm (CUBIC, BBRv1) x payload
# (2 MiB, 50 MiB), 12 cells. In a download the server emits the data and the client
# only acknowledges, so the algorithm under test is the server's.
#
# OLS_IMAGE          OpenLiteSpeed release, pinned by tag; the setup records its digest
#                    and version banner in the manifest. 1.8.5 embeds lsquic 4.4.1.
# INSTANCES          label:quic_cc:udp_port. QUIC congestion control runs in user space
#                    inside lsquic and OpenLiteSpeed exposes it only server-wide
#                    (tuning.quicCongestionCtrl: 1 = CUBIC, 2 = BBRv1), so every algorithm
#                    gets its own OpenLiteSpeed instance whose udp/<udp_port> listener serves
#                    HTTP/3, and the destination port selects the QUIC algorithm. The label
#                    is also the Linux name of the same algorithm for TCP (tcp_cubic,
#                    tcp_bbr = BBRv1).
# TCP_LISTENER       instance:port of the single listener that serves HTTP/2 over TLS for
#                    both algorithms. TCP congestion control belongs to the kernel, not to
#                    the instance: every accepted socket takes the host default in force,
#                    so a second TCP port would carry the same algorithm and select nothing.
#                    tcp/443 is one of the ports the cloud firewall admits (with udp/4461
#                    and udp/4462).
# TCP_CC_PERIOD_S    TCP congestion control is the kernel default of the host network
# TCP_CC_SWITCHES    namespace (net.ipv4.tcp_congestion_control), bound to a connection when
#                    it is accepted. It alternates on a fixed grid of Unix time,
#                    offset_s:algorithm within each period: 240:bbr 540:cubic sets BBRv1
#                    at minutes x4 and CUBIC at minutes x9, 270:bbr 570:cubic at x4:30 and
#                    x9:30. The period is a whole number of minutes that divides one hour;
#                    offsets are whole seconds.
# WINDOW_DELAY_S     the client starts the batch of an algorithm this long after its switch
#                    (CUBIC at x0, BBRv1 at x5); the margin absorbs the clock offset of the
#                    two NTP-disciplined hosts and lets the previous batch's queue drain.
# PAYLOADS           file:size, size in GNU numfmt IEC units (M = 2^20 bytes). Content is
#                    drawn from /dev/urandom so that no layer can compress it.
# TLS_NAME, PUBLIC_IP  subject names of the self-signed P-256 certificate. Clients must send
#                    TLS_NAME as SNI: lsquic in OpenLiteSpeed looks the certificate up by SNI
#                    and aborts a QUIC handshake without one with internal_error (alert 80),
#                    whereas TCP listeners fall back to their default certificate.
# SERVICE_USER       account that runs the units; it must belong to the docker group.

OLS_IMAGE="litespeedtech/openlitespeed:1.8.5-lsphp85"

INSTANCES=(
    "cubic:1:4461"
    "bbr:2:4462"
)
TCP_LISTENER="cubic:443"

TCP_CC_PERIOD_S=600
TCP_CC_SWITCHES=(
    "270:bbr"
    "570:cubic"
)
WINDOW_DELAY_S=30

PAYLOADS=(
    "2MB.bin:2M"
    "50MB.bin:50M"
)

TLS_NAME="starlink-cc.test"
PUBLIC_IP="47.129.174.173"
SERVICE_USER="ubuntu"
